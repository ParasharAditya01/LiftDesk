name: Build check
on:
  push:
    branches: [main, liftdesk-rebuild]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tenant security contract
        run: node scripts/check-security-contract.mjs
